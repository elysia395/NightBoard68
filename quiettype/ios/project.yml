# QuietType iOS App 的 Xcode 工程描述（XcodeGen）
#
# 用法：在本目录执行 `xcodegen generate` 生成 QuietType.xcodeproj。
# CI（.github/workflows/release-ios-app.yml）同样用它生成工程后构建未签名 IPA，
# 因此工程文件本身不入库，改配置改这里即可。
#
# 手动在 Xcode 里建的工程与它等价（见 README-iOS.md 第一节）。

name: QuietType

options:
  bundleIdPrefix: com.nightboard
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh_CN

targets:
  QuietType:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: QuietType   # 7 个 Swift 源文件 + Assets.xcassets（App 图标）
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightboard.quiettype
        PRODUCT_NAME: QuietType
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        # 无签名构建：正式分发签名由侧载工具（AltStore / Sideloadly）或
        # 开发者证书在安装时完成，Xcode 工程不绑定任何 Team
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
